<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Мои прохождения · Викторина по отпускам</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .app.wide { max-width: 1100px; align-items: flex-start; padding-top: 32px; padding-bottom: 64px; }
      .stats-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
      .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 32px; }
      .kpi { background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03)); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 18px 20px; backdrop-filter: blur(20px); }
      .kpi-label { font-size: 12px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 6px; }
      .kpi-value { font-family: 'Unbounded', sans-serif; font-size: 36px; font-weight: 800; line-height: 1; background: var(--grad-primary); background-size: 200% 200%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: gradient-shift 5s ease infinite; }
      .section-title { font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 700; margin: 32px 0 16px; }
      .table-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
      table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
      th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
      th { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); background: rgba(255,255,255,0.04); }
      tr:last-child td { border-bottom: none; }
      tr:hover td { background: rgba(255,255,255,0.04); }
      .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: 12px; }
      .pill.green { background: rgba(61,220,151,0.18); color: #b6f5d8; }
      .pill.red { background: rgba(255,94,126,0.18); color: #ffd0d8; }
      .pill.gray { background: rgba(255,255,255,0.08); color: var(--text-muted); }
      .top-actions { display: flex; gap: 10px; flex-wrap: wrap; }
      .empty { text-align: center; color: var(--text-muted); padding: 60px 20px; }
      .note { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 18px; color: var(--text-muted); font-size: 13px; line-height: 1.5; margin-bottom: 24px; }
    </style>
  </head>
  <body>
    <div class="bg">
      <div class="blob blob1"></div>
      <div class="blob blob2"></div>
      <div class="blob blob3"></div>
    </div>

    <main class="app wide">
      <div class="card" style="width: 100%;">
        <div class="stats-header">
          <div>
            <div class="badge">Моя история</div>
            <h1 class="title" style="font-size: clamp(26px, 4vw, 36px); margin-top: 12px;">
              Мои <span class="title-accent">прохождения</span>
            </h1>
          </div>
          <div class="top-actions">
            <button class="btn btn-ghost" id="csv">Скачать CSV</button>
            <button class="btn btn-ghost" id="clear">Очистить историю</button>
            <a class="btn btn-primary" href="index.html">К квизу</a>
          </div>
        </div>

        <div class="note">
          История прохождений хранится только в этом браузере на этом устройстве. Если вы поделитесь ссылкой на квиз — каждый увидит свою историю на своём устройстве.
        </div>

        <div class="kpi-row" id="kpi-row"></div>

        <h2 class="section-title">Все попытки</h2>
        <div class="table-wrap">
          <table id="sessions-table">
            <thead>
              <tr>
                <th>#</th><th>Имя</th><th>Результат</th><th>%</th><th>Дата</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="questions.js"></script>
    <script>
      const fmtDate = (s) => {
        if (!s) return '—';
        const d = new Date(s);
        return d.toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
      };

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      }

      function loadLocal() {
        try {
          return JSON.parse(localStorage.getItem('quiz_my_sessions') || '[]');
        } catch (_) {
          return [];
        }
      }

      let cachedSessions = [];

      function render() {
        const sessions = loadLocal().slice().reverse();
        cachedSessions = sessions;
        renderKPIs(sessions);
        renderSessions(sessions);
      }

      function renderKPIs(sessions) {
        const total = sessions.length;
        if (!total) {
          document.getElementById('kpi-row').innerHTML = '';
          return;
        }
        const totalAnswers = sessions.reduce((s, x) => s + (x.answers ? x.answers.length : 0), 0);
        const totalCorrect = sessions.reduce((s, x) => s + (x.score || 0), 0);
        const accuracy = totalAnswers ? Math.round((totalCorrect / totalAnswers) * 100) : 0;
        const best = sessions.reduce((m, x) => Math.max(m, x.score || 0), 0);
        const avg = (sessions.reduce((s, x) => s + (x.score || 0), 0) / total).toFixed(1);
        document.getElementById('kpi-row').innerHTML = `
          <div class="kpi"><div class="kpi-label">Попыток</div><div class="kpi-value">${total}</div></div>
          <div class="kpi"><div class="kpi-label">Лучший балл</div><div class="kpi-value">${best}</div></div>
          <div class="kpi"><div class="kpi-label">Средний балл</div><div class="kpi-value">${avg}</div></div>
          <div class="kpi"><div class="kpi-label">Точность</div><div class="kpi-value">${accuracy}%</div></div>
        `;
      }

      function renderSessions(sessions) {
        const tbody = document.querySelector('#sessions-table tbody');
        if (!sessions.length) {
          tbody.innerHTML = `<tr><td colspan="5" class="empty">Здесь появятся ваши попытки после прохождения квиза</td></tr>`;
          return;
        }
        tbody.innerHTML = sessions.map((s, idx) => {
          const total = s.total || 0;
          const pct = total ? Math.round((s.score / total) * 100) : 0;
          return `<tr>
            <td>${sessions.length - idx}</td>
            <td>${escapeHtml(s.name || '—')}</td>
            <td><strong>${s.score}</strong> / ${total}</td>
            <td><span class="pill ${pct >= 80 ? 'green' : pct >= 50 ? 'gray' : 'red'}">${pct}%</span></td>
            <td>${fmtDate(s.finishedAt || s.startedAt)}</td>
          </tr>`;
        }).join('');
      }

      function downloadCsv() {
        if (!cachedSessions.length) return;
        const rows = [['#', 'Имя', 'Балл', 'Всего', 'Процент', 'Начало', 'Финиш']];
        cachedSessions.slice().reverse().forEach((s, i) => {
          const pct = s.total ? Math.round((s.score / s.total) * 100) + '%' : '0%';
          rows.push([i + 1, s.name, s.score, s.total, pct, s.startedAt || '', s.finishedAt || '']);
        });
        const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `quiz-history-${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      }

      function clearHistory() {
        if (!confirm('Удалить всю историю прохождений на этом устройстве?')) return;
        localStorage.removeItem('quiz_my_sessions');
        render();
      }

      document.getElementById('csv').addEventListener('click', downloadCsv);
      document.getElementById('clear').addEventListener('click', clearHistory);
      render();
    </script>
  </body>
</html>
